name: Deploy radio Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare API token'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare account ID'; exit 1; }
          test -n "$CLOUDFLARE_KV_NAMESPACE_ID" || { echo 'Missing KV namespace ID'; exit 1; }
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('deploy-wrangler.json',JSON.stringify({name:'playlist',main:'cloudflare-worker.js',compatibility_date:'2026-11-24',kv_namespaces:[{binding:'SCHEDULES',id:process.env.CLOUDFLARE_KV_NAMESPACE_ID}],durable_objects:{bindings:[{name:'RADIO_ROOM',class_name:'RadioRoom'}]},migrations:[{tag:'v1',new_sqlite_classes:['RadioRoom']}]}))"
          npx --yes wrangler@4.86.0 deploy --config deploy-wrangler.json --keep-vars
