<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffb300"><meta name="description" content="Радио Огонёк"><title>Радио Огонёк</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css?v=14"><style>.time-group,.right-tools{display:flex;align-items:center;gap:12px}.station-name{justify-self:center;white-space:nowrap}.info #play,.info #settings-button{padding:0;border:0;background:transparent;color:#000;line-height:1}.info #play{font-size:.7em}.info #settings-button{font-size:.62em}.info #play:focus,.info #settings-button:focus{outline:0}.info #play:hover,.info #settings-button:hover{background:transparent;color:#000}.slot:hover,.slot:focus-visible{outline:0;background:transparent}.slot.current .dot{animation:none}#youtube-player{width:200px;height:200px;right:-210px;bottom:0;opacity:0}</style></head>
<body><main id="app"><nav class="utility-links" aria-label="Ссылки и поддержка"><span title="Ссылка будет добавлена позже">Telegram</span><a href="https://buymeacoffee.com/indexmod" target="_blank" rel="noopener noreferrer">Coffee</a><span title="Ссылка будет добавлена позже">Крипта</span><span title="Ссылка будет добавлена позже">Сбер</span></nav><header class="info"><span class="header-cell header-time"><span id="clock">--:--:--</span></span><span class="header-cell header-play"><button id="play" type="button" aria-label="Включить радио">▶</button></span><span class="header-cell station-name"><strong>Радио Огонёк</strong></span><span class="header-cell header-settings"><button id="settings-button" type="button" aria-label="Настройки">⚙</button></span><span class="header-cell header-program"><span id="current-title"></span></span><span class="header-cell header-countdown"><span id="to-hour">--:--</span></span></header><p id="notice" aria-live="polite"></p><section id="schedule" aria-label="Расписание на текущий день"></section></main>
<dialog id="editor"><form id="editor-form" method="dialog"><header><strong id="editor-heading">Час эфира</strong><button value="cancel">×</button></header><label>Ссылка YouTube или аудиофайла<input name="url" type="url" placeholder="Вставьте ссылку"></label><label>Название в эфире<input name="userTitle" maxlength="120"></label><p id="original-title"></p><label>Начальная позиция, сек.<input name="start" type="number" min="0" value="0"></label><p id="editor-hint" hidden></p><p id="editor-error" class="error" role="alert" hidden></p><div class="actions"><button id="clear-cell" type="button">Очистить</button><button value="cancel">Отмена</button><button value="default">Сохранить</button></div></form></dialog>
<dialog id="settings"><form id="settings-form" method="dialog"><header><strong>Настройки эфира</strong><button value="cancel">×</button></header><label>Часовой пояс<input name="timezone" required></label><label>Источник по умолчанию<input name="defaultUrl" type="url"></label><label>Название по умолчанию<input name="defaultTitle"></label><label>Длительность джингла, сек.<input name="idDuration" type="number" min="1" max="300"></label><label>MP3 джингла<input name="idUrl"></label><label>Ключ записи Cloudflare<input name="writeKey" type="password" autocomplete="off"></label><div class="actions"><button id="export-data" type="button">Экспорт JSON</button><button value="cancel">Отмена</button><button value="default">Сохранить</button></div></form></dialog><audio id="audio-player" preload="none"></audio><div id="youtube-player"></div><script src="radio-config.js"></script><script src="app.js?v=10"></script></body></html>
