<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Эфир</title><link rel="stylesheet" href="styles.css"></head>
<body><main id="app"><header class="info"><span id="clock">--:--:--</span><span id="to-hour">--:--</span></header><p id="notice" aria-live="polite"></p><section id="schedule" aria-label="Расписание на текущий день"></section></main>
<dialog id="editor"><form id="editor-form" method="dialog"><header><strong id="editor-heading">Час эфира</strong><button value="cancel">×</button></header><label>Ссылка YouTube или аудиофайла<input name="url" type="url" placeholder="Вставьте или перетащите ссылку"></label><label>Название в эфире<input name="userTitle" maxlength="120"></label><p id="original-title"></p><label>Начальная позиция, сек.<input name="start" type="number" min="0" value="0"></label><div class="actions"><button id="clear-cell" type="button">Очистить</button><button value="cancel">Отмена</button><button value="default">Сохранить</button></div></form></dialog>
<dialog id="settings"><form id="settings-form" method="dialog"><header><strong>Настройки эфира</strong><button value="cancel">×</button></header><label>Часовой пояс<input name="timezone" required></label><label>Источник по умолчанию<input name="defaultUrl" type="url"></label><label>Название по умолчанию<input name="defaultTitle"></label><label>Длительность джингла, сек.<input name="idDuration" type="number" min="1" max="300"></label><label>MP3 джингла<input name="idUrl"></label><label>Ключ записи Cloudflare<input name="writeKey" type="password" autocomplete="off"></label><div class="actions"><button id="export-data" type="button">Экспорт JSON</button><button value="cancel">Отмена</button><button value="default">Сохранить</button></div></form></dialog><audio id="audio-player" preload="none"></audio><div id="youtube-player"></div><script src="radio-config.js"></script><script src="app.js"></script></body></html>
