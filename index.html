<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Эфир</title><link rel="stylesheet" href="styles.css"></head>
<body><main>
<header class="statusbar"><button id="play" class="play" type="button">▶ Эфир</button><div><span class="label">Сейчас</span><strong id="now-title">—</strong></div><div><span class="label">Время</span><strong id="clock">—</strong></div><div><span class="label">До часа</span><strong id="to-hour">—</strong></div><div><span class="label">Далее</span><strong id="next-title">—</strong></div><button id="settings-button" class="plain-button" type="button">Настройки</button></header>
<section id="id-banner" class="id-banner" hidden><strong>Следующая программа начнётся через <span id="id-countdown">15</span> секунд</strong></section><p id="notice" class="notice" aria-live="polite"></p>
<section class="schedule-wrap" aria-label="Недельная сетка эфира"><table id="schedule"><thead><tr><th>Время</th><th>Пн</th><th>Вт</th><th>Ср</th><th>Чт</th><th>Пт</th><th>Сб</th><th>Вс</th></tr></thead><tbody></tbody></table></section>
</main>
<dialog id="editor"><form id="editor-form" method="dialog"><div class="dialog-title"><strong id="editor-heading">Ячейка</strong><button value="cancel" aria-label="Закрыть">×</button></div><label>Тип программы<select name="type"><option value="program">Program — новый источник</option><option value="continue">Continue — продолжение</option><option value="jingle">Jingle / ID — вставка</option></select></label><label>URL источника<input name="url" type="url" placeholder="YouTube или прямая ссылка на аудио"></label><label>Отображаемое название<input name="title" type="text" maxlength="120" placeholder="Свободное название программы"></label><label>Начальная позиция, сек.<input name="start" type="number" min="0" step="1" value="0"></label><label>Длительность, сек. (макс. до ID)<input name="duration" type="number" min="1" step="1" placeholder="По умолчанию"></label><label>Длительность ID для этой ячейки, сек.<input name="idDuration" type="number" min="1" step="1" placeholder="Глобальная настройка"></label><div class="dialog-actions"><button id="clear-cell" type="button">Очистить</button><button value="cancel">Отмена</button><button id="save-cell" value="default">Сохранить</button></div></form></dialog>
<dialog id="settings"><form id="settings-form" method="dialog"><div class="dialog-title"><strong>Настройки эфира</strong><button value="cancel" aria-label="Закрыть">×</button></div><label>Часовой пояс расписания<input name="timezone" list="timezones" required><datalist id="timezones"><option>Europe/Moscow</option><option>Europe/London</option><option>America/New_York</option><option>Asia/Almaty</option><option>UTC</option></datalist></label><label>Default Source — URL<input name="defaultUrl" type="url" placeholder="YouTube или прямой аудиофайл"></label><label>Default Source — название<input name="defaultTitle" type="text" maxlength="120"></label><label>Длительность ID, сек.<input name="idDuration" type="number" min="1" max="300"></label><label>Аудиофайл ID<input name="idUrl" type="text"></label><p class="hint">Пустые ячейки используют Default Source. Локальный ID задан относительным путём и работает в подпапке GitHub Pages.</p><div class="dialog-actions"><button id="export-data" type="button">Экспорт JSON</button><label class="import">Импорт JSON<input id="import-data" type="file" accept="application/json"></label><button value="cancel">Отмена</button><button id="save-settings" value="default">Сохранить</button></div></form></dialog>
<div id="youtube-player" aria-hidden="true"></div><audio id="audio-player" preload="none"></audio><script src="app.js"></script></body></html>
